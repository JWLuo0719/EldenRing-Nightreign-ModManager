[package]
name = "nightreign-mod-manager"
version = "0.2.1"
description = "夜临 Mod 管理器 - Elden Ring Nightreign Mod Manager"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
toml = "0.8"
dirs = "6.0"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
trash = "=5.2.3"
sha2 = "0.10"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
codegen-units = 4
